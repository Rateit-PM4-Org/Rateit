<div class="list-item-card">
  <div class="content">
    <div [ngClass]="{ 'ion-margin-bottom': rating.positiveComment || rating.negativeComment }" class="header-row">
      <ion-label>
        <h2 class="title">
          <ion-grid class="ion-no-padding">
            <ion-row>
              @for (star of [1,2,3,4,5]; track star; let i = $index) {
                <ion-col [class]="rating.value && rating.value > 3 ? 'star-green' : (rating.value && rating.value < 3 ? 'star-red' : 'star-orange')"
                  size="auto">
                  <ion-icon [name]="isBelowRating(i)? 'star' : 'star-outline'"/>
                </ion-col>
              }
            </ion-row>
          </ion-grid>
        </h2>
      </ion-label>
      <ion-text color="medium">{{ formatRelativeTime(rating.updatedAt) }}</ion-text>
    </div>
    <div [ngClass]="{ 'ion-margin-bottom': rating.positiveComment }" class="rating-positive">
      @if (rating.positiveComment) {
        <ion-label><b>Positive</b></ion-label>
      }
      <ion-text>{{ rating.positiveComment }}</ion-text>
    </div>
    <div class="rating-negative">
      @if (rating.negativeComment) {
        <ion-label><b>Negative</b></ion-label>
      }
      <ion-text>{{ rating.negativeComment }}</ion-text>
    </div>
  </div>
</div>
